name: Build Zentrix APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup NDK and Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "build-tools;30.0.3" "build-tools;35.0.0" "platforms;android-35"
          cp $ANDROID_HOME/build-tools/30.0.3/dx $ANDROID_HOME/build-tools/35.0.0/dx 2>/dev/null || true
          cp $ANDROID_HOME/build-tools/30.0.3/lib/dx.jar $ANDROID_HOME/build-tools/35.0.0/lib/dx.jar 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fast Build ARM64 APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false -x test --stacktrace
        env:
          GRADLE_OPTS: "-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

      - name: Sign and Align Production APK
        run: |
          APK_RAW=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_RAW"

          # Patch testOnly in binary AndroidManifest.xml and clean broken signatures
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('$APK_RAW', 'r') as zin:
              with zipfile.ZipFile('temp_clean.apk', 'w', compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith('META-INF/') and (item.filename.endswith('.SF') or item.filename.endswith('.RSA') or item.filename.endswith('.MF')):
                          continue
                      data = zin.read(item.filename)
                      if item.filename == 'AndroidManifest.xml':
                          data = data.replace('testOnly'.encode('utf-16le'), 'bestOnly'.encode('utf-16le'))
                      zout.writestr(item, data)
          os.replace('temp_clean.apk', '$APK_RAW')
          "

          # 4-byte zipalign
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -f -p 4 "$APK_RAW" Zentrix-aligned.apk

          # Full signature (v1 + v2 + v3 + v4) using release keystore
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks TMessagesProj/config/release.keystore --ks-key-alias androidkey --ks-pass pass:android --key-pass pass:android --out Zentrix-arm64-v8a.apk Zentrix-aligned.apk

          # Verify signatures
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Zentrix-arm64-v8a.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zentrix-ARM64-APK
          path: "Zentrix-arm64-v8a.apk"
          retention-days: 14
